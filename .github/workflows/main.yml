name: Lab3 CI

on:
  push:
    branches: [main, my-pr]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Lint + Unit + Coverage ≥ 80%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage gate
        run: npm run test:coverage -- --reporter=verbose
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: frontend/coverage/
          if-no-files-found: warn

  security:
    name: Security Audit (critical)
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: npm audit — frontend
        working-directory: frontend
        run: npm audit --audit-level=critical
      - name: npm audit — backend
        working-directory: backend
        run: npm audit --audit-level=critical
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    name: Integration Tests (REST API + Mongo)
    runs-on: ubuntu-latest
    needs: [unit]
    env:
      JWT_SECRET: ci-test-secret
      JWT_KEY: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      JWT_SECRET: ci-test-secret
      JWT_KEY: ci-test-secret
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/edgistify
      baseURL: http://localhost:5173
      BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Seed database
        working-directory: backend
        run: node seed.js
      - name: Start backend + frontend
        run: |
          (cd backend && npm start > /tmp/backend.log 2>&1 &)
          (cd frontend && npm run dev > /tmp/frontend.log 2>&1 &)
          npx wait-on --timeout 120000 http://localhost:5000/api/products http://localhost:5173
      - name: Run Playwright E2E
        working-directory: e2e
        run: npx playwright test --project=chromium --reporter=list
      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/backend.log || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/results/
          if-no-files-found: ignore

  build:
    name: Build (production)
    runs-on: ubuntu-latest
    needs: [unit, security, integration, e2e]   # ← все gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
