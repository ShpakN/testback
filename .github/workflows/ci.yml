name: CI

# Триггеры: каждый push и каждый pull request в main.
# "При каждом сохранении" в CI не работает — для этого настроен pre-commit хук
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Отменяет предыдущий прогон при новом пуше в ту же ветку
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # Стадия 1: LINT + UNIT-ТЕСТЫ + COVERAGE GATE
  unit-lint:
    name: Lint + Unit (coverage >= 80%)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      #  FRONTEND: install, lint, unit + coverage 
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Lint frontend (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests + coverage (Vitest)
        working-directory: frontend
        run: npm run test:coverage -- --reporter=verbose --reporter=junit --outputFile=reports/vitest-junit.xml

      #  QUALITY GATE: coverage < 80% => пайплайн падает 
      # c8/vitest сам падает, если не выполнен порог из vitest.config.ts,
      # но проверяем summary явно, чтобы падение было наглядным.
      - name: Quality gate — coverage >= 80%
        if: always()
        run: node scripts/check-coverage.mjs
        working-directory: frontend

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: |
            frontend/coverage/
            frontend/reports/vitest-junit.xml
          retention-days: 14

      - name: Coverage summary in job summary
        if: always()
        run: cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY || true
        working-directory: frontend

      #  BACKEND: install, lint 
      - name: Install backend deps
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Lint backend (ESLint)
        working-directory: backend
        run: npm run lint

  # Стадия 2: SECURITY — критические уязвимости валят пайплайн
  security:
    name: Security (npm audit + gitleaks)
    runs-on: ubuntu-latest
    # Не блокирует unit-lint, но падение отсюда блокирует integration и e2e
    needs: [unit-lint]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (lockfile only)
        run: |
          cd frontend && npm ci --ignore-scripts
          cd ../backend && npm ci --ignore-scripts

      #  QUALITY GATE: critical vulnerabilities => FAIL 
      - name: npm audit — critical/moderate gate
        run: |
          echo "=== frontend ==="
          cd frontend && npm audit --audit-level=high
          echo "=== backend ==="
          cd ../backend && npm audit --audit-level=high
        # --audit-level=high: падает при high и critical. Убрать --omit=dev если dev-зависимости тоже проверяются

      # ---------- Поиск секретов в коде ----------
      - name: Gitleaks — поиск секретов
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Стадия 3: INTEGRATION (MongoDB in-memory, Supertest)
  integration:
    name: Integration (REST API + Mongo in-memory)
    runs-on: ubuntu-latest
    needs: [unit-lint, security]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Create test .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          NODE_ENV=test
          JWT_SECRET=ci-test-secret-not-for-production
          PORT=5000
          EOF

      - name: Integration tests (node:test + supertest + mongodb-memory-server)
        working-directory: backend
        run: node --env-file=.env --test --test-reporter=junit --test-reporter-destination=reports/integration-junit.xml tests

      - name: Publish integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report
          path: backend/reports/
          retention-days: 14

  # Стадия 4: E2E (Playwright, Chromium)
  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    needs: [integration]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            e2e/package-lock.json

      - name: Install deps
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci
          cd ../e2e && npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Start backend + serve frontend
        run: |
          cd backend
          cat > .env <<'EOF'
          NODE_ENV=test
          JWT_SECRET=ci-test-secret-not-for-production
          MONGO_URI=${{ secrets.MONGO_TEST_URI }}
          PORT=5000
          EOF
          node server.js &
          cd .. && npx serve -s frontend/dist -l 3000 &
          npx wait-on http://localhost:3000 http://localhost:5000/api/products --timeout 60000

      - name: Seed test data
        working-directory: backend
        run: npm run seed || true

      - name: Run Playwright tests
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
          CI: "true"
        run: npx playwright test --project=chromium

      - name: Publish Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14

  # Стадия 5: BUILD — выполняется, только если всё корректно (зелёное)
  build:
    name: Build (deploy-ready)
    runs-on: ubuntu-latest
    needs: [unit-lint, security, integration, e2e]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install + build frontend
        run: |
          cd frontend && npm ci && npm run build

      - name: Verify backend starts
        run: |
          cd backend && npm ci
          node -e "require('./index'); console.log('Express app loads OK');"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist/
          retention-days: 7
