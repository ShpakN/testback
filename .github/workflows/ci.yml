name: Lab3 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. ЛИНТ + UNIT + COVERAGE (frontend)
  unit:
    name: Lint + Unit (coverage >= 80%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        run: npm install --no-audit --no-fund

      - name: Lint frontend (ESLint)
        run: npm run lint

      - name: Unit tests + coverage (Vitest)
        run: npm run test:coverage -- --reporter=verbose --reporter=junit --outputFile=reports/vitest-junit.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      - name: Unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-junit
          path: frontend/reports/vitest-junit.xml
          if-no-files-found: ignore

  # 2. SECURITY GATE (npm audit + gitleaks)
  security:
    name: Security (npm audit + gitleaks)
    runs-on: ubuntu-latest
    needs: [unit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: npm audit — frontend (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: npm audit — backend (high+)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Gitleaks — secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 3. INTEGRATION (Node Test Runner + Mongo in-memory )
  integration:
    name: Integration (REST API + Mongo in-memory)
    runs-on: ubuntu-latest
    needs: [unit]

    env:
      JWT_SECRET: ci-test-secret
      JWT_KEY: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Run integration tests
        working-directory: backend
        run: npm run test:integration

  # 4. E2E (Playwright + Chromium)
  e2e:
    name: E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    needs: [unit]

    env:
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install backend deps
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  # 5. BUILD (deploy-ready) — блокируется при падении unit
  build:
    name: Build (deploy-ready)
    runs-on: ubuntu-latest
    needs: [unit, integration]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
